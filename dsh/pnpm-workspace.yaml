# Allow the esbuild postinstall (downloads the platform binary) to run and any
# other native build scripts the toolchain pulls in. pnpm runs a sub-install in
# a temp checkout of this repo when preparing the plugin; an un-allowlisted
# build script would fail that sub-install.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-group@1.0.3'
  - '@deepseek-ai/cordis-plugin-include@1.0.8'
  - '@deepseek-ai/cordis-plugin-loader@1.0.4'
  - '@deepseek-ai/cosmokit@1.8.4'
  - '@deepseek-ai/dsh-agent@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-api-remotes@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-app-boot@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-atomic-write@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-client-locale@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-client-store@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-client-ui-primitives@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-client-ui-renderer@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-client-ui-settings@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-client-ui-slots@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-config-editor@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-home-paths@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-launch-environment@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-llm@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-package-manifest@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-session@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-settings@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-system-prompt@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-timeout@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-tools@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-typert-protocol@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-util-crypto@0.1.7-alpha.1'
  - '@deepseek-ai/dsh-util-values@0.1.7-alpha.1'
  - '@deepseek-ai/schemastery@3.18.3'
overrides:
  # The dsh graph requests several @deepseek-ai/* transitive packages in
  # prerelease-ambiguous ranges (>=0.1.5 <0.2.0-0) that the registry mirror
  # cannot satisfy; pin the published -rc.2 exactly so the standalone workspace
  # installs. Only applied to the rc.2 line's transitive utilities — the host
  # entry packages (dsh-llm/dsh-tools/...) stay on their 0.1.3-alpha.2 line.
  "@deepseek-ai/dsh-invariants": "0.1.5-rc.2"
  "@deepseek-ai/dsh-scope": "0.1.5-rc.2"
  "@deepseek-ai/dsh-brand": "0.1.5-rc.2"
  "@deepseek-ai/dsh-deque": "0.1.5-rc.2"
